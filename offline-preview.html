<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minimalism Dark Red – Offline Preview</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; }
      body { background: #fff; }
      #invitation-preview { width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <audio id="background-music" autoplay loop preload="auto">
      <source src="assets/audio/beautiful-in-white.mp3" type="audio/mpeg" />
    </audio>
    <!-- The mirror includes the server-rendered preview but not its live backend. -->
    <iframe
      id="invitation-preview"
      title="Offline invitation preview"
      sandbox="allow-same-origin"
      src="chungdoi.com/templates/minimalism-dark-red/demo.html?preview=appvertex"
    ></iframe>
    <script>
      const backgroundMusic = document.querySelector('#background-music');
      const invitationPreview = document.querySelector('#invitation-preview');
      const startMusic = () => backgroundMusic.play().catch(() => {});
      const listenForInvitationGesture = () => {
        const invitationDocument = invitationPreview.contentDocument;
        invitationDocument?.addEventListener('pointerdown', startMusic, { once: true, capture: true });
        invitationDocument?.addEventListener('keydown', startMusic, { once: true, capture: true });
      };

      startMusic();
      window.addEventListener('pointerdown', startMusic, { once: true });
      window.addEventListener('keydown', startMusic, { once: true });
      invitationPreview.addEventListener('load', listenForInvitationGesture);
    </script>
  </body>
</html>
